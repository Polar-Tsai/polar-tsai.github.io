[config.site]
title = "PolarVista"
description = "喜歡觀察生活事物，並將好奇心具現化，然後一一寫成文字。"
pageTitle = "PolarVista | 把好奇心具現化，把觀察與經歷寫成文字"
pageDescription = "喜歡觀察生活上的困難並試圖解決它，實作過程都會記錄在此。涵蓋公共議題、開發日記、第一線問題，還有理財筆記。"
url = "https://polar-tsai.github.io/"
repository = "https://github.com/dodolalorc/astro-navfolio"
footerNote = "© 2026 PolarVista. Built with curiosity."

[config.theme]
# 可用色盘：
# green-soft, green-vivid, rose-soft, pink-soft, purple-soft, blue-soft, orange-soft, brown-soft
palette = "green-soft"
# 原生 UI 语言。可用值：en、zh-CN、zh-TW。未知值会回退到 en。
lang = "zh-TW"

[config.fonts]
# 英文与代码感 UI 字体
en = "Maple Mono"
code = "Monaco"
# 中文閱讀字體：霞鶩文楷 TC，由 src/styles/fonts.css 載入 @fontsource/lxgw-wenkai-tc
#（依字元切片，每頁只下載用到的字）
zh = "LXGW WenKai TC"
# 留空 = 字體由 fonts.css 載入；只有改用單一字體檔（放 public/fonts/）時才填路徑
file = ""

[config.code]
lightTheme = "catppuccin-latte"
darkTheme = "catppuccin-macchiato"
lineNumbers = true
wrap = true
preserveIndent = true
collapseStyle = "collapsible-auto"

[config.math]
render = "katex" # "katex" | "mathjax"

[config.comments]
enabled = false
provider = "none"
show_on_posts = true

[config.search]
enabled = true
shortcut = "mod+k"
placeholder = "Search notes..."
maxResults = 6

[config.pages.blog]
title = "Writing notes"
kicker = "Notebook archive"
subtitle = "Notes from the margins."
note = "Field notes, drafts, and technical margins arranged for slow browsing."
postsPerPage = 6
# date-fns 使用的日期格式模板。
dateFormat = "yyyy-MM-dd"
# 元信息分隔符。可以使用 "|"、"/" 等符号，也可以使用特殊值 "icon"。
metadataSeparator = "icon"
# 文章列表封面样式："card" 保留带边框的缩略图，"mask" 会将图片融合到右侧。
coverImageStyle = "mask"

[config.pages.blog.categories]
title = "Categories"
kicker = "Browse notes"
subtitle = ""
note = "A quiet index of recurring topics, gathered from article frontmatter."

[config.pages.blog.series]
title = "Series"
kicker = "Reading paths"
subtitle = ""
note = "Connected notes that can be followed in the order they were written."

[config.pages.projects]
title = "Projects"
kicker = "Project shelf"
subtitle = "Small tools and site systems."
note = "A compact shelf for implementation choices, releases, and publishing experiments."

[config.pages.vibe]
title = "vibe"
kicker = ""
subtitle = "Life and coding fragments."
note = "Not formal enough for blog posts, but still part of the story."
showTrail = true

[config.pages.media]
title = "书影音"
subtitle = "读过、看过、听过的作品，以及一点当时的感受。"
note = "一页浏览书、电影、剧集、专辑与播客。"

# 分類／標籤／系列頁的 meta description（會出現在 Google 搜尋結果）
# key 用「顯示名稱」（跟文章 frontmatter 裡寫的一樣）；沒寫的會自動用該分類下的文章標題產生。

[config.descriptions.categories]
onsite = "第一線議題：第一線工作現場的觀察與問題解決紀錄"
life = "生活議題：在職涯、職場上的所見所聞與所想"
money = "錢錢議題：與理財、投資有關的實踐與學習"
civic = "公共議題：與公共政策、社會與生活的相關執行或協助紀錄"

[config.descriptions.tags]
"開發日記" = "非資工背景自學開發、架站過程的踩坑紀錄"
"非資工人" = "非資工人對於這個世界的見解" 
"職涯" = "工作與內心的交流，不管好的壞的"

[config.descriptions.series]

[config.comments.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
input_position = "top"
light_theme = "light"
dark_theme = "dark"
lang = "zh-CN"
loading = "lazy"

