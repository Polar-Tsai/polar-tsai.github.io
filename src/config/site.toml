[config.home]

[config.home.quote]
text = [
  "— where curiosity takes shape, and stays.",
]

[config.home.intro]
title = "Polar Vista"
name = "Polar Vista"
body = [
  "The name combines \"Polar\" and \"Vista\".",
  "\"Polar\" is my English name; \"Vista\" is the view you see when you look far ahead.",
  "PolarVista is where my curiosity takes shape — where what I observe and experience becomes words, and stays.",
  "這個名字融合了「Polar」與「Vista」。",
  "Polar 是我的英文名字；Vista 是視野、是眺望遠方的景色。",
  "PolarVista，是我把好奇心具現化，把觀察與經歷寫成文字，留在這個網路世界裡。"
]

